<div class="support-screen">
  <app-atmosphere [glow]="0.22" [count]="7"></app-atmosphere>

  <div class="scroll-body">
    <app-admin-header title="Ajustes" (back)="goBack()"></app-admin-header>

    <!-- Perfil del agente -->
    <div class="profile-card">
      <img [src]="logo" alt="" class="profile-watermark"/>

      <div class="avatar-wrap">
        <div class="avatar-ring">
          <div class="staff-initial" [style.background]="staffInitBg">{{ staffInitial }}</div>
        </div>
      </div>

      <div class="identity">
        <div class="identity-name">{{ perfil()?.displayName || perfil()?.username || 'Agente' }}</div>
        <div class="identity-sub">Panel de soporte</div>
        <div class="identity-role">
          <app-icon [svg]="iconShield" [size]="14" style="color:var(--gold-1)"></app-icon>
          <span>Rol: <span class="role-value">Agente de soporte</span></span>
        </div>
      </div>
    </div>

    <!-- Cuenta -->
    <app-group-label>Cuenta</app-group-label>
    <app-group-card>
      <app-setting-row
        [icon]="iconPersonCircle"
        label="Información personal"
        (rowClick)="goPerfil()"
      ></app-setting-row>
      <app-setting-row
        [icon]="iconLock"
        label="Seguridad"
        [last]="true"
        (rowClick)="goSeguridad()"
      ></app-setting-row>
    </app-group-card>

    <!-- Preferencias -->
    <app-group-label>Preferencias</app-group-label>
    <app-group-card>
      <div class="row-with-toggle">
        <app-setting-row
          [icon]="iconNotifs"
          label="Notificaciones"
          [showChevron]="false"
        ></app-setting-row>
        <div class="toggle-overlay">
          <app-toggle [on]="notif" (changed)="setNotif($event)"></app-toggle>
        </div>
      </div>
      <div class="row-with-toggle">
        <app-setting-row
          [icon]="iconVolume"
          label="Sonido de alerta"
          [showChevron]="false"
          [last]="true"
        ></app-setting-row>
        <div class="toggle-overlay">
          <app-toggle [on]="sound" (changed)="sound = $event"></app-toggle>
        </div>
      </div>
    </app-group-card>

    <!-- General -->
    <app-group-label>General</app-group-label>
    <app-group-card>
      <app-setting-row
        [icon]="iconDoc"
        label="Términos y Condiciones"
        (rowClick)="goTerminos()"
      ></app-setting-row>
      <app-setting-row
        [icon]="iconShield"
        label="Políticas de Privacidad"
        [last]="true"
        (rowClick)="goPoliticas()"
      ></app-setting-row>
    </app-group-card>

    <!-- Cerrar sesión -->
    <div class="logout-wrap">
      <app-gold-button (clicked)="logout()">
        <span class="logout-content">
          <app-icon [svg]="iconPower" [size]="18"></app-icon>
          Cerrar sesión
        </span>
      </app-gold-button>
    </div>
  </div>

  <app-support-nav current="ajustes"></app-support-nav>
</div>
