<div class="support-screen">
  <app-atmosphere [glow]="0.24" [count]="8"></app-atmosphere>

  <div class="scroll-body">
    <app-admin-header title="Cambiar contraseña" (back)="goBack()"></app-admin-header>

    <form class="pass-form" [formGroup]="form" (ngSubmit)="submit()">
      <app-field
        label="Contraseña actual"
        placeholder="Ingresa tu contraseña actual"
        [password]="true"
        [control]="oldPasswordCtrl"
      ></app-field>

      <app-field
        label="Nueva contraseña"
        placeholder="Mínimo 8 caracteres"
        [password]="true"
        [control]="newPasswordCtrl"
      ></app-field>

      <app-field
        label="Confirmar nueva contraseña"
        placeholder="Repite la nueva contraseña"
        [password]="true"
        [control]="confirmPasswordCtrl"
      ></app-field>

      <div class="pass-error" *ngIf="errorMsg">{{ errorMsg }}</div>
      <div class="pass-success" *ngIf="successMsg">{{ successMsg }}</div>

      <button class="pass-submit" type="submit" [disabled]="loading">
        {{ loading ? 'Guardando…' : 'Guardar contraseña' }}
      </button>
    </form>
  </div>

  <app-support-nav current="ajustes"></app-support-nav>
</div>
