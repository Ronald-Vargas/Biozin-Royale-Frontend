<div class="admin-header">
  <button class="back-btn" (click)="back.emit()">
    <app-icon [svg]="iconBack" [size]="23"></app-icon>
  </button>

  <h2 class="gold-text title">{{ title }}</h2>

  <button *ngIf="showFilter" class="filter-btn" (click)="filter.emit()">
    <app-icon [svg]="iconFilter" [size]="21"></app-icon>
  </button>
</div>
