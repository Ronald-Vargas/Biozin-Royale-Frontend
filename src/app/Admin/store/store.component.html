<div class="admin-screen">
  <app-atmosphere [glow]="0.24" [count]="8"></app-atmosphere>

  <div class="scroll-body">
    <app-admin-header title="Tienda" (back)="onBack()"></app-admin-header>

    <!-- Secciones del módulo -->
    <div class="chips" role="group" aria-label="Secciones de la tienda">
      <button type="button" *ngFor="let s of secciones" [class.activo]="ui.seccion() === s.k" (click)="ui.irSeccion(s.k)">
        {{ s.t }}<em class="nuevo" *ngIf="s.nuevo">nuevo</em>
      </button>
    </div>

    <div [ngSwitch]="ui.seccion()">
      <app-admin-store-summary *ngSwitchCase="'res'"></app-admin-store-summary>
      <app-admin-store-logistics *ngSwitchCase="'log'"></app-admin-store-logistics>
      <app-admin-store-orders *ngSwitchCase="'ord'"></app-admin-store-orders>
      <app-admin-store-products *ngSwitchCase="'prods'"></app-admin-store-products>
      <app-admin-store-inventory *ngSwitchCase="'inv'"></app-admin-store-inventory>
    </div>
  </div>

  <app-admin-nav current="tienda"></app-admin-nav>

  <!-- Aviso emergente: pedido nuevo o cambio del cliente -->
  <app-store-push *ngIf="ui.banner() as b" [title]="b.titulo" [text]="b.texto" [layer]="60" (opened)="ui.abrirAviso(b)"></app-store-push>

  <app-store-toast *ngIf="ui.aviso() as a" [text]="a" [layer]="40"></app-store-toast>

  <!-- Hojas inferiores: pedido y producto -->
  <app-store-sheet *ngIf="ui.hoja()" [scroll]="true" (closed)="ui.cerrarHoja()">
    <app-admin-store-order-sheet *ngIf="ui.hoja() === 'pedido'"></app-admin-store-order-sheet>
    <app-admin-store-product-sheet *ngIf="ui.hoja() === 'producto'"></app-admin-store-product-sheet>
  </app-store-sheet>

  <!-- Confirmación -->
  <app-store-confirm-dialog
    *ngIf="ui.dialogo() as d"
    [compact]="true"
    [title]="d.titulo"
    [text]="d.texto"
    [ok]="d.ok"
    [keep]="d.conservar"
    (accepted)="ui.aceptarDialogo()"
    (cancelled)="ui.cancelarDialogo()"
  ></app-store-confirm-dialog>
</div>
