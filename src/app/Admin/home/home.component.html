<div class="admin-screen">
  <app-atmosphere [glow]="0.26" [count]="8"></app-atmosphere>

  <div class="scroll-body">
    <!-- Brand header -->
    <div class="brand">
      <img [src]="logo" alt="Biozin Royale" class="brand-logo"/>
      <div class="brand-text">
        <span class="gold-text brand-1">BIOZIN</span>
        <span class="brand-2">ROYALE</span>
      </div>
    </div>

    <!-- Profile card -->
    <div class="profile-card" (click)="goPerfil()">
      <div class="profile-avatar">
        <image-slot
          id="admin-photo"
          shape="circle"
          placeholder="Foto"
          style="width:54px;height:54px;display:block;background:#15110b"
        ></image-slot>
      </div>
      <div class="profile-info">
        <div class="profile-greeting">Hola, Administrador</div>
        <div class="profile-sub">Bienvenido al panel de control</div>
      </div>
      <app-icon [svg]="iconChevron" [size]="20" style="color:var(--gold-2)"></app-icon>
    </div>

    <!-- KPI grid -->
    <div class="kpi-grid">
      <ng-container *ngIf="!loadingKpis; else kpiSkeleton">
        <app-kpi-card *ngFor="let k of kpis" [kpi]="k"></app-kpi-card>
      </ng-container>
      <ng-template #kpiSkeleton>
        <div class="kpi-skeleton" *ngFor="let i of [1,2,3,4]"></div>
      </ng-template>
    </div>

    <!-- Acceso rápido: Supervisión de soporte -->
    <div class="support-card" (click)="goSoporte()">
      <div class="support-icon">
        <app-icon [svg]="iconChatbubbles" [size]="22" style="color:var(--gold-1)"></app-icon>
      </div>
      <div class="support-text">
        <div class="support-title">Supervisión de soporte</div>
        <div class="support-sub">Tickets, rendimiento por agente y resueltos</div>
      </div>
      <app-icon [svg]="iconChevron" [size]="20" style="color:var(--gold-2)"></app-icon>
    </div>

    <!-- Acceso rápido: Solicitudes internas de soporte -->
    <div class="support-card" (click)="goSolicitudes()">
      <div class="support-icon">
        <app-icon [svg]="iconSwap" [size]="22" style="color:var(--gold-1)"></app-icon>
      </div>
      <div class="support-text">
        <div class="support-title">Solicitudes internas</div>
        <div class="support-sub">Pedidos de soporte que requieren tu acción</div>
      </div>
      <app-icon [svg]="iconChevron" [size]="20" style="color:var(--gold-2)"></app-icon>
    </div>

  </div>

  <app-admin-nav current="home"></app-admin-nav>
</div>
