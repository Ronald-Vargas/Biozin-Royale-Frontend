<div class="user-row" (click)="open.emit(user.id)">
  <app-user-avatar [size]="50"></app-user-avatar>

  <div class="user-info">
    <div class="user-top">
      <span class="user-name">{{ user.displayName || user.username }}</span>
      <app-status-badge [status]="user.status === 'active' ? 'Activo' : 'Inactivo'"></app-status-badge>
    </div>
    <div class="user-role">{{ user.email }}</div>
    <div class="user-id">@{{ user.username }}</div>
  </div>

  <app-icon [svg]="iconChevron" [size]="20" style="color:var(--gold-2)"></app-icon>
</div>
