<div class="cp-screen">
  <app-atmosphere [glow]="0.28" [count]="10"></app-atmosphere>

  <div class="cp-body">
    <!-- Ícono de acceso -->
    <div class="cp-icon-wrap">
      <div class="cp-icon">
        <app-icon [svg]="iconLock" [size]="36" style="color:var(--gold-1)"></app-icon>
      </div>
    </div>

    <!-- Encabezado -->
    <div class="cp-title">Cambiar contraseña</div>
    <div class="cp-subtitle">
      Es tu primer ingreso al sistema.<br>
      Crea una contraseña segura para continuar.
    </div>

    <!-- Badge de identidad -->
    <div class="cp-identity" *ngIf="perfil">
      <app-icon [svg]="iconShield" [size]="14" style="color:var(--gold-1)"></app-icon>
      <span>{{ perfil.displayName || perfil.username }}</span>
      <span class="cp-role-badge" [style.color]="perfil.role === 'admin' ? 'var(--gold-1)' : '#7eb8f7'">
        {{ perfil.role === 'admin' ? 'Administrador' : 'Soporte' }}
      </span>
    </div>

    <!-- Formulario -->
    <form class="cp-form" [formGroup]="form" (ngSubmit)="submit()">
      <app-field
        label="Contraseña temporal"
        placeholder="Contraseña que recibiste"
        [password]="true"
        [control]="oldPasswordCtrl"
      ></app-field>

      <app-field
        label="Nueva contraseña"
        placeholder="Mínimo 8 caracteres"
        [password]="true"
        [control]="newPasswordCtrl"
      ></app-field>

      <app-field
        label="Confirmar contraseña"
        placeholder="Repite la nueva contraseña"
        [password]="true"
        [control]="confirmPasswordCtrl"
      ></app-field>

      <div class="cp-error" *ngIf="errorMsg">{{ errorMsg }}</div>

      <button class="cp-submit" type="submit" [disabled]="loading">
        {{ loading ? 'Guardando…' : 'Establecer contraseña' }}
      </button>
    </form>
  </div>
</div>
