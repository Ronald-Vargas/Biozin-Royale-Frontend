<div class="admin-screen">
  <app-atmosphere [glow]="0.22" [count]="7"></app-atmosphere>

  <div class="scroll-body">
    <app-admin-header title="Registrar miembro" (back)="goBack()"></app-admin-header>

    <app-form-field
      label="Nombre completo"
      placeholder="Ej. María González"
      [icon]="iconPerson"
      [(value)]="name"
    ></app-form-field>

    <app-form-field
      label="Correo electrónico"
      placeholder="Ej. maria@gmail.com"
      [icon]="iconMail"
      type="email"
      [value]="emailCtrl.value ?? ''"
      (valueChange)="onEmailChange($event)"
    ></app-form-field>
    <div *ngIf="emailCtrl.invalid && emailCtrl.touched" class="field-error">
      Ingresá un correo electrónico válido.
    </div>

    <app-phone-field
      [control]="phoneCtrl"
      placeholder="Ej. +506 8888 8888"
    ></app-phone-field>

    <app-select-field
      label="Rol"
      [icon]="iconShield"
      [value]="role"
      [options]="roleOptions"
      (valueChange)="role = $event"
      help="Puedes crear miembros con rol Administrador o Soporte."
    ></app-select-field>

    <!-- Nota -->
    <div class="auto-note">
      <app-icon [svg]="iconSparkles" [size]="18" class="note-icon"></app-icon>
      <div class="note-text">
        El <b>usuario</b> y una <b>contraseña temporal</b> se generan automáticamente.
        El <b>nivel de acceso</b> se asigna según el rol y las <b>credenciales</b>
        se envían al correo del miembro.
      </div>
    </div>

    <div *ngIf="errorMsg" class="field-error field-error--general">{{ errorMsg }}</div>

    <!-- Crear -->
    <button class="create-btn" [disabled]="saving" (click)="submit()">
      <div *ngIf="saving; else idleBtn" class="btn-spinner"></div>
      <ng-template #idleBtn>
        <app-icon [svg]="iconPersonAdd" [size]="21"></app-icon>
        Crear miembro
      </ng-template>
    </button>
  </div>

  <app-admin-nav current="usuarios"></app-admin-nav>
</div>
