<div class="uc-backdrop" (click)="close()">
  <div class="uc-card" (click)="$event.stopPropagation()">

    <!-- Ilustración SVG animada -->
    <div class="uc-scene">
      <svg viewBox="0 0 220 180" xmlns="http://www.w3.org/2000/svg" class="uc-svg">

        <!-- Grúa -->
        <line x1="28" y1="155" x2="28" y2="38" stroke="#8a6a1e" stroke-width="5" stroke-linecap="round"/>
        <line x1="25" y1="38" x2="105" y2="38" stroke="#8a6a1e" stroke-width="5" stroke-linecap="round"/>
        <line x1="105" y1="38" x2="105" y2="62" stroke="#c79a32" stroke-width="1.5" stroke-dasharray="5,4"/>
        <!-- cable contrapeso -->
        <line x1="28" y1="38" x2="14" y2="60" stroke="#8a6a1e" stroke-width="3" stroke-linecap="round"/>
        <rect x="8" y="60" width="12" height="10" rx="2" fill="#8a6a1e"/>

        <!-- Andamio -->
        <line x1="70" y1="55" x2="70" y2="155" stroke="#c79a32" stroke-width="2.5"/>
        <line x1="150" y1="55" x2="150" y2="155" stroke="#c79a32" stroke-width="2.5"/>
        <line x1="70" y1="65" x2="150" y2="65" stroke="#c79a32" stroke-width="2"/>
        <line x1="70" y1="105" x2="150" y2="105" stroke="#c79a32" stroke-width="2"/>
        <!-- cruces del andamio -->
        <line x1="70" y1="65" x2="110" y2="105" stroke="#c79a32" stroke-width="1" opacity="0.45"/>
        <line x1="110" y1="65" x2="70" y2="105" stroke="#c79a32" stroke-width="1" opacity="0.45"/>
        <line x1="110" y1="65" x2="150" y2="105" stroke="#c79a32" stroke-width="1" opacity="0.45"/>
        <line x1="150" y1="65" x2="110" y2="105" stroke="#c79a32" stroke-width="1" opacity="0.45"/>

        <!-- Edificio (piso 1 completo, piso 2 a medias) -->
        <rect x="70" y="105" width="80" height="50" fill="#1a1206" rx="2"/>
        <rect x="82" y="115" width="18" height="14" fill="#0a0712" rx="2"/>
        <rect x="111" y="115" width="18" height="14" fill="#0a0712" rx="2"/>
        <rect x="82" y="133" width="18" height="14" fill="#0a0712" rx="2"/>
        <rect x="111" y="133" width="18" height="14" fill="#0a0712" rx="2"/>
        <!-- piso 2 incompleto: solo borde -->
        <rect x="70" y="65" width="80" height="40" fill="#120e04" rx="2"
              stroke="#c79a32" stroke-width="1" stroke-dasharray="6,4"/>

        <!-- Pilas de materiales en el suelo -->
        <rect x="162" y="140" width="30" height="10" rx="2" fill="#3a2c10"/>
        <rect x="164" y="133" width="26" height="8" rx="2" fill="#2a1f06"/>
        <rect x="166" y="127" width="22" height="7" rx="2" fill="#1a1206"/>

        <!-- Suelo -->
        <rect x="5" y="155" width="210" height="8" rx="3" fill="#2a1f06"/>

        <!-- Barrera izquierda -->
        <rect x="10" y="150" width="50" height="9" rx="2" fill="#f3923a"/>
        <line x1="16" y1="150" x2="10" y2="159" stroke="#0a0712" stroke-width="3.5" opacity="0.35"/>
        <line x1="23" y1="150" x2="17" y2="159" stroke="#0a0712" stroke-width="3.5" opacity="0.35"/>
        <line x1="30" y1="150" x2="24" y2="159" stroke="#0a0712" stroke-width="3.5" opacity="0.35"/>
        <line x1="37" y1="150" x2="31" y2="159" stroke="#0a0712" stroke-width="3.5" opacity="0.35"/>
        <line x1="44" y1="150" x2="38" y2="159" stroke="#0a0712" stroke-width="3.5" opacity="0.35"/>
        <line x1="51" y1="150" x2="45" y2="159" stroke="#0a0712" stroke-width="3.5" opacity="0.35"/>
        <line x1="60" y1="150" x2="54" y2="159" stroke="#0a0712" stroke-width="3.5" opacity="0.35"/>

        <!-- Barrera derecha -->
        <rect x="160" y="150" width="50" height="9" rx="2" fill="#f3923a"/>
        <line x1="166" y1="150" x2="160" y2="159" stroke="#0a0712" stroke-width="3.5" opacity="0.35"/>
        <line x1="173" y1="150" x2="167" y2="159" stroke="#0a0712" stroke-width="3.5" opacity="0.35"/>
        <line x1="180" y1="150" x2="174" y2="159" stroke="#0a0712" stroke-width="3.5" opacity="0.35"/>
        <line x1="187" y1="150" x2="181" y2="159" stroke="#0a0712" stroke-width="3.5" opacity="0.35"/>
        <line x1="194" y1="150" x2="188" y2="159" stroke="#0a0712" stroke-width="3.5" opacity="0.35"/>
        <line x1="201" y1="150" x2="195" y2="159" stroke="#0a0712" stroke-width="3.5" opacity="0.35"/>
        <line x1="210" y1="150" x2="204" y2="159" stroke="#0a0712" stroke-width="3.5" opacity="0.35"/>

        <!-- Obrero (grupo animado: sube/baja) -->
        <g class="worker">
          <!-- Casco -->
          <ellipse cx="110" cy="58" rx="13" ry="4.5" fill="#f3923a"/>
          <rect x="100" y="52" width="20" height="10" rx="6" fill="#f3923a"/>
          <!-- Cabeza -->
          <circle cx="110" cy="68" r="10" fill="#f3d24e"/>
          <circle cx="107" cy="67" r="1.8" fill="#2a1f06"/>
          <circle cx="113" cy="67" r="1.8" fill="#2a1f06"/>
          <path d="M107 73 Q110 76.5 113 73" fill="none" stroke="#2a1f06" stroke-width="1.5" stroke-linecap="round"/>
          <!-- Cuerpo / chaleco -->
          <rect x="102" y="78" width="16" height="22" rx="4" fill="#2f8de0"/>
          <rect x="102" y="83" width="16" height="4" fill="#f3d24e" opacity="0.85"/>
          <rect x="102" y="91" width="16" height="4" fill="#f3d24e" opacity="0.85"/>
          <!-- Piernas -->
          <rect x="103" y="100" width="6" height="14" rx="3" fill="#143f7a"/>
          <rect x="111" y="100" width="6" height="14" rx="3" fill="#143f7a"/>
          <!-- Brazo derecho (quieto) -->
          <rect x="118" y="78" width="13" height="6" rx="3" fill="#2f8de0"/>
        </g>

        <!-- Brazo izquierdo + martillo (animado independiente) -->
        <g class="hammer-arm">
          <rect x="89" y="78" width="13" height="6" rx="3" fill="#2f8de0"/>
          <!-- Mango -->
          <rect x="74" y="74" width="16" height="4.5" rx="2" fill="#8a6a1e"/>
          <!-- Cabeza del martillo -->
          <rect x="65" y="68" width="11" height="14" rx="2.5" fill="#5a5240"/>
          <!-- brillo en martillo -->
          <rect x="66" y="69" width="4" height="3" rx="1" fill="#8a8070" opacity="0.6"/>
        </g>

        <!-- Engranaje (animado: gira) -->
        <g class="gear">
          <circle cx="185" cy="28" r="16" fill="none" stroke="#c79a32" stroke-width="3.5"/>
          <circle cx="185" cy="28" r="7"  fill="#1a1206" stroke="#c79a32" stroke-width="2"/>
          <!-- dientes -->
          <rect x="182" y="8"  width="6" height="9" rx="2.5" fill="#c79a32"/>
          <rect x="182" y="39" width="6" height="9" rx="2.5" fill="#c79a32"/>
          <rect x="165" y="25" width="9" height="6" rx="2.5" fill="#c79a32"/>
          <rect x="196" y="25" width="9" height="6" rx="2.5" fill="#c79a32"/>
          <rect x="169" y="11" width="7" height="9" rx="2.5" fill="#c79a32" transform="rotate(45 172.5 15.5)"/>
          <rect x="196" y="11" width="7" height="9" rx="2.5" fill="#c79a32" transform="rotate(-45 199.5 15.5)"/>
          <rect x="169" y="36" width="7" height="9" rx="2.5" fill="#c79a32" transform="rotate(-45 172.5 40.5)"/>
          <rect x="196" y="36" width="7" height="9" rx="2.5" fill="#c79a32" transform="rotate(45 199.5 40.5)"/>
        </g>

        <!-- Chispas (animadas: aparecen/desaparecen) -->
        <circle class="spark s1" cx="90"  cy="82" r="2.5" fill="#f3d24e"/>
        <circle class="spark s2" cx="82"  cy="75" r="1.8" fill="#f3923a"/>
        <circle class="spark s3" cx="95"  cy="70" r="2"   fill="#c79a32"/>
        <circle class="spark s4" cx="78"  cy="80" r="1.5" fill="#fff2c4"/>
      </svg>
    </div>

    <!-- Nombre del juego -->
    <div class="uc-game-name">{{ gameName }}</div>

    <!-- Título -->
    <div class="uc-title">🚧 Juego en Construcción</div>

    <!-- Subtítulo divertido -->
    <p class="uc-sub">
      Nuestros mejores constructores están trabajando duro en esto.
      Muy pronto podrás disfrutarlo — ¡prometemos que vale la pena esperar!
    </p>

    <!-- Barra de progreso (falsa, loop) -->
    <div class="uc-progress-wrap">
      <div class="uc-progress-track">
        <div class="uc-progress-bar"></div>
      </div>
      <span class="uc-progress-label">Construyendo experiencia... casi listo...</span>
    </div>

    <!-- Botón cerrar -->
    <button class="uc-btn" (click)="close()">Volver a los juegos</button>
  </div>
</div>
