<div class="wheel-wrap" [style.width.px]="size" [style.height.px]="size">
  <div class="wheel-glow"></div>

  <svg
    viewBox="0 0 200 200"
    [attr.width]="size"
    [attr.height]="size"
    class="wheel-svg"
  >
    <defs>
      <linearGradient id="rwGold" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0"    stop-color="#fff2c4"/>
        <stop offset="0.35" stop-color="#e9c969"/>
        <stop offset="0.7"  stop-color="#c79a32"/>
        <stop offset="1"    stop-color="#7c5a14"/>
      </linearGradient>
      <linearGradient id="rwGold2" x1="0" y1="1" x2="1" y2="0">
        <stop offset="0"   stop-color="#fff2c4"/>
        <stop offset="0.5" stop-color="#c79a32"/>
        <stop offset="1"   stop-color="#8a6a1e"/>
      </linearGradient>
      <linearGradient id="rwArm" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0"    stop-color="#fff6d8"/>
        <stop offset="0.45" stop-color="#e0bd5e"/>
        <stop offset="0.55" stop-color="#a87e22"/>
        <stop offset="1"    stop-color="#5e4410"/>
      </linearGradient>
      <radialGradient id="rwRed" cx="0.5" cy="0.32" r="0.78">
        <stop offset="0"   stop-color="#e0473a"/>
        <stop offset="0.6" stop-color="#b3242b"/>
        <stop offset="1"   stop-color="#6f1318"/>
      </radialGradient>
      <radialGradient id="rwBlack" cx="0.5" cy="0.32" r="0.82">
        <stop offset="0"   stop-color="#2c281f"/>
        <stop offset="0.6" stop-color="#17130d"/>
        <stop offset="1"   stop-color="#060403"/>
      </radialGradient>
      <radialGradient id="rwGreen" cx="0.5" cy="0.32" r="0.82">
        <stop offset="0" stop-color="#2fae63"/>
        <stop offset="1" stop-color="#105930"/>
      </radialGradient>
      <radialGradient id="rwHub" cx="0.42" cy="0.34" r="0.72">
        <stop offset="0"    stop-color="#fffaf0"/>
        <stop offset="0.35" stop-color="#f3d77f"/>
        <stop offset="0.72" stop-color="#c79a32"/>
        <stop offset="1"    stop-color="#6e5212"/>
      </radialGradient>
      <radialGradient id="rwInner" cx="0.5" cy="0.38" r="0.66">
        <stop offset="0"   stop-color="#2a2016"/>
        <stop offset="0.7" stop-color="#120d08"/>
        <stop offset="1"   stop-color="#080605"/>
      </radialGradient>
      <radialGradient id="rwGloss" cx="0.5" cy="0.26" r="0.6">
        <stop offset="0"    stop-color="rgba(255,255,255,0.2)"/>
        <stop offset="0.42" stop-color="rgba(255,255,255,0.03)"/>
        <stop offset="1"    stop-color="rgba(255,255,255,0)"/>
      </radialGradient>
    </defs>

    <!-- Rim -->
    <circle cx="100" cy="100" r="99"   fill="url(#rwGold2)"/>
    <circle cx="100" cy="100" r="96"   fill="url(#rwGold)"/>
    <circle cx="100" cy="100" r="94.5" fill="#0a0807"/>
    <circle cx="100" cy="100" r="94.5" fill="none" stroke="#caa23f" stroke-width="0.4" opacity="0.45"/>
    <circle cx="100" cy="100" r="89.5" fill="none" stroke="#caa23f" stroke-width="0.4" opacity="0.4"/>

    <!-- Rotating group -->
    <g
      class="wheel-rotor"
      [class.wheel-rotor--free]="freeSpinning"
      [style.transform]="'rotate(' + rotation + 'deg)'"
    >
      <circle cx="100" cy="100" [attr.r]="rPocketOut + 0.6" fill="url(#rwGold2)"/>

      <!-- Pockets -->
      <path
        *ngFor="let s of sectors"
        [attr.d]="s.path"
        [attr.fill]="s.fill"
      />

      <!-- Frets -->
      <line
        *ngFor="let s of sectors"
        [attr.x1]="fretLine(s).x1"
        [attr.y1]="fretLine(s).y1"
        [attr.x2]="fretLine(s).x2"
        [attr.y2]="fretLine(s).y2"
        stroke="url(#rwGold2)"
        stroke-width="0.6"
        opacity="0.8"
      />

      <circle cx="100" cy="100" [attr.r]="rPocketOut" fill="none" stroke="url(#rwGold)" stroke-width="1.2"/>
      <circle cx="100" cy="100" [attr.r]="rPocketIn"  fill="none" stroke="url(#rwGold)" stroke-width="1.2"/>

      <!-- Numbers -->
      <text
        *ngFor="let s of sectors"
        [attr.x]="s.lx"
        [attr.y]="s.ly"
        [attr.fill]="s.col === 'black' ? '#f6ead0' : '#ffffff'"
        font-size="8"
        font-weight="700"
        font-family="Montserrat, sans-serif"
        text-anchor="middle"
        dominant-baseline="central"
        stroke="rgba(0,0,0,0.35)"
        stroke-width="0.4"
        style="paint-order: stroke"
        [attr.transform]="'rotate(' + (s.ang + 180) + ' ' + s.lx + ' ' + s.ly + ')'"
      >{{ s.n }}</text>

      <!-- Inner disc -->
      <circle cx="100" cy="100" [attr.r]="rPocketIn - 0.5" fill="url(#rwInner)"/>
      <circle cx="100" cy="100" [attr.r]="rPocketIn - 0.5" fill="none" stroke="url(#rwGold)" stroke-width="1" opacity="0.7"/>
      <circle cx="100" cy="100" [attr.r]="rPocketIn - 12"  fill="none" stroke="#c79a3233" stroke-width="0.5"/>
      <circle cx="100" cy="100" [attr.r]="rPocketIn - 24"  fill="none" stroke="#c79a3233" stroke-width="0.5"/>

      <!-- Turret -->
      <g>
        <polygon
          *ngFor="let rot of arms"
          [attr.points]="armPoints()"
          fill="url(#rwArm)"
          opacity="0.96"
          [attr.transform]="'rotate(' + rot + ' 100 100)'"
        />
        <circle
          *ngFor="let k of armKnobs"
          [attr.cx]="k.x"
          [attr.cy]="k.y"
          r="2"
          fill="url(#rwHub)"
          stroke="#7c5a14"
          stroke-width="0.3"
        />
        <circle cx="100" cy="100" r="17"   fill="#0e0a06" opacity="0.55"/>
        <circle cx="100" cy="100" r="15"   fill="url(#rwGold2)"/>
        <circle cx="100" cy="100" r="12.5" fill="url(#rwHub)"/>
        <circle cx="100" cy="100" r="8.5"  fill="url(#rwHub)" stroke="#7c5a14" stroke-width="0.5"/>
        <ellipse cx="97.5" cy="96.8" rx="3.6" ry="2.6" fill="#fffdf6" opacity="0.85" transform="rotate(-30 97.5 96.8)"/>
        <circle cx="100" cy="100" r="3"   fill="#8a6a1e"/>
        <circle cx="100" cy="100" r="1.4" fill="url(#rwGold)"/>
      </g>
    </g>

    <!-- Gloss -->
    <ellipse cx="100" cy="72" rx="76" ry="52" fill="url(#rwGloss)" pointer-events="none"/>

    <!-- Pointer -->
    <path d="M 100 4 L 95 13.5 L 105 13.5 Z" fill="url(#rwGold)" stroke="#7c5a14" stroke-width="0.5"/>
    <circle cx="100" cy="13.5" r="1.8" fill="url(#rwGold)"/>
  </svg>

  <!-- Ball -->
  <div
    class="ball"
    [style.width.px]="ballSize"
    [style.height.px]="ballSize"
  ></div>
</div>
