<div class="emblem">
  <div class="emblem-glow"></div>

  <div class="emblem-row">
    <svg width="15" height="30" viewBox="0 0 18 30" class="curl">
      <path [attr.d]="curl" fill="none" stroke="#e9c969" stroke-width="2" stroke-linecap="round"/>
      <circle cx="15" cy="2"  r="1.6" fill="#fff2c4"/>
      <circle cx="15" cy="28" r="1.6" fill="#fff2c4"/>
    </svg>

    <div class="emblem-text">
      <div class="gates-label">GATES OF</div>
      <div class="gold-text biozin-label">BIOZIN</div>
    </div>

    <svg width="15" height="30" viewBox="0 0 18 30" class="curl curl--flip">
      <path [attr.d]="curl" fill="none" stroke="#e9c969" stroke-width="2" stroke-linecap="round"/>
      <circle cx="15" cy="2"  r="1.6" fill="#fff2c4"/>
      <circle cx="15" cy="28" r="1.6" fill="#fff2c4"/>
    </svg>
  </div>

  <div class="emblem-rule">
    <span class="rule-line"></span>
    <span class="rule-diamond"></span>
    <span class="rule-line rule-line--flip"></span>
  </div>
</div>
