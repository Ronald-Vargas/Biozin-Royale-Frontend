<svg
  viewBox="0 0 100 100"
  width="100%"
  height="100%"
  class="facet-gem"
>
  <circle
    *ngIf="isRound"
    cx="50" cy="50" r="42"
    [attr.fill]="fillBody"
    [attr.stroke]="stroke"
    stroke-width="1.5"
  />

  <polygon
    *ngIf="!isRound"
    [attr.points]="shape.outer"
    [attr.fill]="fillBody"
    [attr.stroke]="stroke"
    stroke-width="1.5"
    stroke-linejoin="round"
  />

  <polygon [attr.points]="shape.table" [attr.fill]="fillTable"/>

  <line
    *ngFor="let l of lines"
    [attr.x1]="l.x1" [attr.y1]="l.y1"
    [attr.x2]="l.x2" [attr.y2]="l.y2"
    stroke="rgba(255,255,255,0.28)"
    stroke-width="0.8"
  />

  <polygon
    [attr.points]="shape.table"
    fill="none"
    stroke="rgba(255,255,255,0.5)"
    stroke-width="0.8"
  />

  <polygon [attr.points]="shape.hi" fill="rgba(255,255,255,0.55)"/>
</svg>
