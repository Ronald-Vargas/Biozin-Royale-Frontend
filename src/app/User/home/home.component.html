<ion-content [fullscreen]="true" class="home-content">
  <div class="home-root">
    <app-atmosphere [glow]="0.3" [count]="9"></app-atmosphere>

    <!-- Scroll area -->
    <div class="scroll-area">

      <!-- Top bar -->
      <div class="top-bar">
        <div class="avatar" (click)="goMiPerfil()">

          <app-icon [svg]="iconPerson" [size]="27" style="color:var(--gold-1)"></app-icon>
        </div>

        <div class="balance-pill" *ngIf="!isGuest">
          <span class="balance-amount">
            {{ balance() != null ? (balance()! | currency:'USD':'symbol':'1.2-2') : '$ ----' }}
          </span>
          <div class="add-btn" (click)="goDeposito()">
            <app-icon [svg]="iconAdd" [size]="18" style="color:#2a1f06"></app-icon>
          </div>
        </div>
      </div>

      <!-- Hero -->
      <div class="hero-block">
        <div class="welcome-label">WELCOME TO</div>
        <h1 class="gold-text hero-title">BIOZIN ROYALE</h1>
        <app-cards-hero [width]="228" [delay]="0.1"></app-cards-hero>
      </div>

      <!-- Juegos destacados -->
      <div class="section">
        <app-section-head
          title="Juegos destacados"
          (action)="goJuegos()"
        ></app-section-head>
        <div class="games-grid">
          <app-games-card
          *ngFor="let g of games"
          [game]="g"
          (click)="onGameClick(g.name)"
        ></app-games-card>
        </div>
      </div>

      <!-- Apuestas deportivas -->
      <div class="section">
        <app-section-head
          title="Apuestas deportivas"
          (action)="goApuestas()"
        ></app-section-head>

        <div class="sport-previews">
          <div *ngFor="let m of featuredMatches" class="sport-preview">
            <div class="sp-meta">
              <span class="sp-league">{{ m.league }}</span>
              <span class="sp-time">{{ m.time }}</span>
            </div>
            <div class="sp-teams">
              <span class="sp-team">{{ m.team1 }}</span>
              <span class="sp-vs">VS</span>
              <span class="sp-team sp-team--right">{{ m.team2 }}</span>
            </div>
            <div class="sp-odds">
              <button
                class="sp-odd"
                [class.sp-odd--on]="isBetOn(m.id, 'home')"
                (click)="toggleBet(m.id, 'home')"
              >
                <span class="sp-lbl">1</span>
                <span class="sp-val">{{ m.odds.home | number:'1.2-2' }}</span>
              </button>
              <button
                *ngIf="m.odds.draw !== null"
                class="sp-odd"
                [class.sp-odd--on]="isBetOn(m.id, 'draw')"
                (click)="toggleBet(m.id, 'draw')"
              >
                <span class="sp-lbl">X</span>
                <span class="sp-val">{{ m.odds.draw | number:'1.2-2' }}</span>
              </button>
              <button
                class="sp-odd"
                [class.sp-odd--on]="isBetOn(m.id, 'away')"
                (click)="toggleBet(m.id, 'away')"
              >
                <span class="sp-lbl">2</span>
                <span class="sp-val">{{ m.odds.away | number:'1.2-2' }}</span>
              </button>
            </div>
          </div>
        </div>

        <div class="home-slip" *ngIf="betSelectionCount > 0">
          <span class="home-slip-info">
            <span class="home-slip-badge">{{ betSelectionCount }}</span>
            Selección{{ betSelectionCount !== 1 ? 'es' : '' }}
          </span>
          <button class="home-slip-btn" (click)="goApuestas()">Apostar</button>
        </div>
      </div>

    </div><!-- /scroll-area -->

    <app-bottom-nav 
      [current]="'home'">
    </app-bottom-nav>
  </div>
</ion-content>
