<app-screen-shell
  title="Soporte"
  current="perfil"
  (back)="goBack()"
>
  <div class="page-inner">
  <!-- Hero banner -->
  <div class="hero">
    <div class="hero-text">
      <div class="hero-title">¿Necesitas ayuda?</div>
      <div class="hero-sub">
        Nuestro equipo está disponible 24/7 para asistirte.
      </div>
    </div>

    <div class="hero-icon-wrap">
      <div class="hero-glow"></div>
      <app-icon [svg]="iconHeadset" [size]="52" class="hero-icon"></app-icon>
    </div>

    <!-- Sparkles -->
    <div class="sparkle sparkle--1"></div>
    <div class="sparkle sparkle--2"></div>
  </div>

  <app-group-label>Contacto rápido</app-group-label>

  <div class="items-list">
    <div
      *ngFor="let s of items"
      class="item"
      (click)="onPick(s.key)"
    >
      <div class="item-icon">
        <app-icon
          [svg]="s.icon"
          [size]="20"
          [style.color]="s.iconColor"
        ></app-icon>
      </div>

      <div class="item-body">
        <div class="item-label">{{ s.label }}</div>
        <div class="item-sub" [style.color]="s.subColor">{{ s.sub }}</div>
      </div>

      <app-icon [svg]="iconChevron" [size]="18" style="color:#6f6757"></app-icon>
    </div>
  </div>
  </div>
</app-screen-shell>
