<app-screen-shell
  title="Historial de Juegos"
  current="perfil"
  (back)="goBack()"
>
  <div class="page-inner">
  <p *ngIf="loading">Cargando historial...</p>
  <p *ngIf="errorMsg">{{ errorMsg }}</p>

  <div *ngIf="!loading && !errorMsg && gameHist.length === 0" class="empty-wrap">
    <app-icon [svg]="iconDice" [size]="44" class="empty-icon"></app-icon>
    <div class="empty-title">Sin partidas jugadas</div>
    <div class="empty-sub">Aún no has jugado ninguna partida. ¡Entra a los juegos y empieza a jugar!</div>
  </div>

  <ng-container *ngIf="!loading && !errorMsg && gameHist.length > 0">

  <div class="hist-list">
    <div *ngFor="let g of gameHist" class="hist-row">

      <!-- Línea superior: juego + fecha -->
      <div class="row-top">
        <div class="cell-game">
          <app-game-thumb [game]="g"></app-game-thumb>
          <span class="game-name">{{ g.name }}</span>
        </div>
        <div class="cell-date">
          <span class="date-day">{{ g.date }}</span>
          <span class="date-time">{{ g.time }}</span>
        </div>
      </div>

      <!-- Línea inferior: desglose financiero -->
      <div class="row-fin">
        <div class="fin-block">
          <span class="fin-label">Apostado</span>
          <span class="fin-value">${{ fmtAmt(g.bet) }}</span>
        </div>

        <span class="fin-arrow">→</span>

        <div class="fin-block">
          <span class="fin-label">Ganancia</span>
          <span class="fin-value fin-value--payout">
            {{ g.payout > 0 ? '$' + fmtAmt(g.payout) : '—' }}
          </span>
        </div>

        <span class="fin-arrow">=</span>

        <div class="fin-block fin-block--result">
          <span class="fin-label">Neto</span>
          <span
            class="fin-value fin-value--net"
            [class.fin-value--pos]="g.result > 0"
            [class.fin-value--neg]="g.result < 0"
          >{{ fmt(g.result) }}</span>
        </div>
      </div>

    </div>
  </div>

  </ng-container>
  </div>
</app-screen-shell>
