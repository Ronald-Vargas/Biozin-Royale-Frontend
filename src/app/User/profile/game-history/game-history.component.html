<app-screen-shell
  title="Historial de Juegos"
  current="perfil"
  (back)="goBack()"
>
  <div class="page-inner">
  <p *ngIf="loading">Cargando historial...</p>
  <p *ngIf="errorMsg">{{ errorMsg }}</p>

  <div *ngIf="!loading && !errorMsg && gameHist.length === 0" class="empty-wrap">
    <app-icon [svg]="iconDice" [size]="44" class="empty-icon"></app-icon>
    <div class="empty-title">Sin partidas jugadas</div>
    <div class="empty-sub">Aún no has jugado ninguna partida. ¡Entra a los juegos y empieza a jugar!</div>
  </div>

  <ng-container *ngIf="!loading && !errorMsg && gameHist.length > 0">
  <!-- Table head -->
  <div class="table-head">
    <span class="th">Juego</span>
    <span class="th th--center">Fecha</span>
    <span class="th th--right">Apuesta</span>
    <span class="th th--right">Resultado</span>
  </div>

  <!-- Rows -->
  <div class="table-body">
    <div *ngFor="let g of gameHist" class="table-row">
      <div class="cell-game">
        <app-game-thumb [game]="g"></app-game-thumb>
        <span class="game-name">{{ g.name }}</span>
      </div>

      <div class="cell-date">
        <div class="date-day">{{ g.date }}</div>
        <div class="date-time">{{ g.time }}</div>
      </div>

      <span class="cell-bet">${{ g.bet }}</span>

      <span
        class="cell-result"
        [style.color]="g.result >= 0 ? '#4fd190' : '#e06a6a'"
      >{{ fmt(g.result) }}</span>
    </div>
  </div>
  </ng-container>
  </div>
</app-screen-shell>
