<app-screen-shell
  title="Mi Perfil"
  current="perfil"
  (back)="goBack()"
>
  <div class="page-inner">
  <!-- Profile card -->
  <div class="profile-card">
    <img class="logo-watermark" src="assets/logo.png" alt="" />

    <!-- Avatar -->
    <div class="avatar-wrap">
      <div class="avatar-ring">
        <div class="avatar-slot">Foto</div>
      </div>
      <div class="camera-btn">
        <app-icon [svg]="iconCamera" [size]="14" style="color:#2a1f06"></app-icon>
      </div>
    </div>

    <!-- Identity -->
    <div class="identity">
      <div class="identity-name">Juan Pérez</div>
      <div class="identity-handle">&#64;juanperez4</div>

      <div class="meta-row">
        <app-icon [svg]="iconFinger" [size]="14" style="color:var(--gold-1)"></app-icon>
        <span class="meta-text">
          ID de jugador: <span class="meta-value">84527193</span>
        </span>
        <app-icon
          [svg]="copied ? iconCheck : iconCopy"
          [size]="14"
          class="copy-btn"
          [style.color]="copied ? '#4fd190' : 'var(--gold-2)'"
          (click)="copyId()"
        ></app-icon>
      </div>

      <div class="meta-row">
        <app-icon [svg]="iconCalendar" [size]="14" style="color:var(--gold-1)"></app-icon>
        <span class="meta-text">
          Miembro desde: <span class="meta-value">Mayo 2026</span>
        </span>
      </div>
    </div>
  </div>

  <!-- Información personal -->
  <div class="section-head">
    <app-icon [svg]="iconPersonCircle" [size]="19" style="color:var(--gold-1)"></app-icon>
    <span class="section-title">Información personal</span>
  </div>

  <div class="info-card">
    <div
      *ngFor="let r of info; let last = last"
      class="info-row"
      [class.info-row--last]="last"
    >
      <div class="info-icon">
        <app-icon [svg]="r.icon" [size]="17" style="color:var(--gold-1)"></app-icon>
      </div>
      <span class="info-key">{{ r.k }}</span>
      <span class="info-value">{{ r.v }}</span>
    </div>
  </div>

  <!-- Botón editar -->
  <button class="edit-btn" (click)="editInfo()">
    <app-icon [svg]="iconEdit" [size]="18"></app-icon>
    Editar información
  </button>

  <!-- Estadísticas -->
  <div class="section-head">
    <app-icon [svg]="iconStats" [size]="18" style="color:var(--gold-1)"></app-icon>
    <span class="section-title">Estadísticas</span>
  </div>

  <div class="stats-grid">
    <div *ngFor="let s of stats" class="stat-card">
      <app-icon [svg]="s.icon" [size]="24" style="color:var(--gold-1)"></app-icon>
      <div class="gold-text stat-value">{{ s.value }}</div>
      <div class="stat-label">{{ s.label }}</div>
    </div>
  </div>
  </div>
</app-screen-shell>
