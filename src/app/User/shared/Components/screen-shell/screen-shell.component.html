<ion-content [fullscreen]="true" class="shell-content">
  <div class="shell-root">
    <app-atmosphere [glow]="glow" [count]="8"></app-atmosphere>

    <div class="shell-body" [class.shell-body--boxed]="boxedBack">
      <!-- Header -->
      <div class="screen-header">
        <button class="header-back" [class.boxed]="boxedBack" (click)="back.emit()">
          <app-icon [svg]="iconBack" [size]="23"></app-icon>
        </button>
        <h2 class="gold-text header-title">{{ title }}</h2>
        <div class="header-end">
          <ng-content select="[shell-header-end]"></ng-content>
        </div>
      </div>

      <!-- Contenido proyectado -->
      <div class="shell-slot">
        <ng-content></ng-content>
      </div>
    </div>

    <app-bottom-nav
      *ngIf="showNav"
      [current]="current"
    ></app-bottom-nav>
  </div>
</ion-content>
