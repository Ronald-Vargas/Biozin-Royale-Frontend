<ion-button
  class="btn-gold"
  expand="block"
  shape="round"
  [disabled]="loading || disabled"
  (click)="onClick()"
>
  <ion-spinner *ngIf="loading" name="crescent"></ion-spinner>
  <span *ngIf="!loading" class="btn-label">
    <ng-content></ng-content>
  </span>
  <span class="shine"></span>
</ion-button>
