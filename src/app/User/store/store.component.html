<app-screen-shell [title]="titulo()" current="tienda" [glow]="0.3" (back)="nav.onBack()">

  <!-- Íconos del encabezado: mis pedidos (con avisos sin leer) y carrito -->
  <div shell-header-end>
    <ng-container *ngIf="mostrarIconos()">
      <button class="hi" type="button" aria-label="Mis pedidos" (click)="nav.ir('mine')">
        <app-icon [svg]="iconRecibo" [size]="19"></app-icon>
        <span class="badge" *ngIf="noLeidas()">{{ noLeidas() }}</span>
      </button>
      <button class="hi" type="button" aria-label="Carrito" (click)="nav.ir('cart')">
        <app-icon [svg]="iconCarrito" [size]="19"></app-icon>
        <span class="badge" *ngIf="cart.cantidadCarrito()">{{ cart.cantidadCarrito() }}</span>
      </button>
    </ng-container>
  </div>

  <!-- Una ventana por vista; cada una trae su propia barra de acción fija -->
  <div class="page-inner" [ngSwitch]="nav.vista()">
    <app-store-home *ngSwitchCase="'home'"></app-store-home>
    <app-store-product-detail *ngSwitchCase="'prod'"></app-store-product-detail>
    <app-store-cart *ngSwitchCase="'cart'"></app-store-cart>
    <app-store-checkout *ngSwitchCase="'chk'"></app-store-checkout>
    <app-store-order-done *ngSwitchCase="'ok'"></app-store-order-done>
    <app-store-my-orders *ngSwitchCase="'mine'"></app-store-my-orders>
    <app-store-order-tracking *ngSwitchCase="'track'"></app-store-order-tracking>
  </div>

  <!-- Aviso emergente cuando cambia el estado de un pedido -->
  <app-store-push *ngIf="nav.banner() as b" [title]="b.titulo" [text]="b.texto" (opened)="nav.abrirAviso(b)"></app-store-push>

  <!-- Aviso al añadir -->
  <app-store-toast
    *ngIf="nav.aviso() as a"
    [text]="a.texto"
    [actionLabel]="a.verCarrito ? 'Ver carrito' : ''"
    (action)="nav.ir('cart')"
  ></app-store-toast>

  <!-- Hojas inferiores: talla, dirección y nueva fecha -->
  <ng-container *ngIf="nav.hoja() as h" [ngSwitch]="h.tipo">
    <app-store-size-sheet *ngSwitchCase="'tallas'" [productoId]="h.id || ''"></app-store-size-sheet>
    <app-store-address-sheet *ngSwitchCase="'direccion'" [pedidoNo]="h.id || ''"></app-store-address-sheet>
    <app-store-date-sheet *ngSwitchCase="'fecha'" [pedidoNo]="h.id || ''"></app-store-date-sheet>
  </ng-container>

  <!-- Confirmación -->
  <app-store-confirm-dialog
    *ngIf="nav.dialogo() as d"
    [title]="d.titulo"
    [text]="d.texto"
    [ok]="d.ok"
    [keep]="d.conservar"
    (accepted)="nav.aceptarDialogo()"
    (cancelled)="nav.cancelarDialogo()"
  ></app-store-confirm-dialog>

</app-screen-shell>
