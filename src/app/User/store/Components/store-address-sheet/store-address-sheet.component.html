<app-store-sheet (closed)="nav.hoja.set(null)">
  <div class="contenido">
    <h3>Cambiar dirección</h3>
    <p class="muted">Puedes cambiarla hasta que tu pedido esté empacado.</p>
    <app-store-location-fields
      [(provincia)]="provincia"
      [(canton)]="canton"
      [(distrito)]="distrito"
    ></app-store-location-fields>
    <label class="campo">Dirección exacta (señas)
      <input type="text" placeholder="Casa, color, punto de referencia…" [(ngModel)]="direccion" />
    </label>
    <p class="error" role="alert" *ngIf="error()">{{ error() }}</p>
    <div class="acciones">
      <button type="button" class="btn-fantasma" (click)="nav.hoja.set(null)">Cancelar</button>
      <button type="button" class="btn-oro" (click)="guardar()">Guardar dirección</button>
    </div>
  </div>
</app-store-sheet>
