<img
  *ngIf="producto.imagen && !fotoRota"
  class="foto"
  [src]="producto.imagen"
  [alt]="producto.nombre"
  loading="lazy"
  (error)="fotoRota = true"
/>

<svg *ngIf="!producto.imagen || fotoRota" class="arte" viewBox="0 0 200 200" role="img" [attr.aria-label]="producto.nombre">
  <ellipse cx="100" cy="184" rx="58" ry="6" fill="#000" opacity=".4" />
  <ng-container [ngSwitch]="producto.arte">

    <g *ngSwitchCase="'tee'">
      <path class="trazo" [attr.fill]="producto.variante" d="M62 28l24-8q14 16 28 0l24 8 34 34-22 20-14-12v100H64V70L50 82 28 62z" />
      <path class="trazo-fino" d="M86 20q14 14 28 0" />
      <image href="assets/logo.png" x="76" y="52" width="48" height="48" />
    </g>

    <g *ngSwitchCase="'hood'">
      <path class="trazo" [attr.fill]="producto.variante" d="M62 28l24-8q14 16 28 0l24 8 34 34-22 20-14-12v100H64V70L50 82 28 62z" />
      <path class="trazo" fill="#0d0a05" d="M78 22q22 40 44 0" />
      <path class="trazo-fino" d="M72 132h56l8 34H64z" />
      <image href="assets/logo.png" x="78" y="56" width="44" height="44" />
    </g>

    <g *ngSwitchCase="'cap'">
      <path class="trazo" [attr.fill]="producto.variante" d="M44 124q0-64 56-64t56 64z" />
      <path class="trazo" fill="#0d0a05" d="M40 124h130q12 0 10 9t-16 7H46q-12 0-6-16z" />
      <image href="assets/logo.png" x="78" y="72" width="44" height="44" />
    </g>

    <g *ngSwitchCase="'mug'">
      <path class="trazo" [attr.fill]="producto.variante" d="M52 56h82v92q0 14-14 14H66q-14 0-14-14z" />
      <path d="M134 76h14q16 0 16 22t-16 22h-14" fill="none" stroke="#d4a73c" stroke-width="6" />
      <rect x="52" y="56" width="82" height="8" fill="#d4a73c" />
      <image href="assets/logo.png" x="68" y="78" width="50" height="50" />
    </g>

    <g *ngSwitchCase="'key'">
      <circle cx="100" cy="46" r="16" fill="none" stroke="#a89c80" stroke-width="5" />
      <path d="M100 62v30" stroke="#a89c80" stroke-width="4" />
      <image [attr.href]="'assets/chip-' + producto.variante + '.png'" x="48" y="88" width="104" height="104" />
    </g>

    <g *ngSwitchCase="'pin'">
      <image href="assets/logo.png" x="40" y="40" width="120" height="120" />
    </g>

    <g *ngSwitchCase="'tote'">
      <path d="M76 78q0-34 24-34t24 34" fill="none" stroke="#d4a73c" stroke-width="5" />
      <path class="trazo" [attr.fill]="producto.variante" d="M56 76h88l8 96H48z" />
      <image href="assets/logo.png" x="74" y="98" width="52" height="52" />
    </g>

    <g *ngSwitchCase="'post'">
      <rect class="trazo" [attr.fill]="producto.variante" x="52" y="24" width="96" height="150" rx="4" />
      <image href="assets/logo.png" x="64" y="44" width="72" height="72" />
      <rect x="76" y="142" width="48" height="3" fill="#d4a73c" />
    </g>

    <g *ngSwitchCase="'cards'">
      <image href="assets/cards.png" x="8" y="6" width="184" height="186" />
    </g>

    <g *ngSwitchCase="'dice'">
      <rect class="trazo" [attr.fill]="producto.variante" x="34" y="78" width="68" height="68" rx="13" />
      <circle cx="52" cy="96" r="5.5" fill="#d4a73c" /><circle cx="84" cy="96" r="5.5" fill="#d4a73c" />
      <circle cx="68" cy="112" r="5.5" fill="#d4a73c" />
      <circle cx="52" cy="128" r="5.5" fill="#d4a73c" /><circle cx="84" cy="128" r="5.5" fill="#d4a73c" />
      <g transform="rotate(12 141 79)">
        <rect class="trazo" [attr.fill]="producto.variante" x="112" y="50" width="58" height="58" rx="11" />
        <circle cx="126" cy="64" r="5" fill="#d4a73c" /><circle cx="141" cy="79" r="5" fill="#d4a73c" />
        <circle cx="156" cy="94" r="5" fill="#d4a73c" />
      </g>
    </g>

    <g *ngSwitchCase="'mat'">
      <ellipse class="trazo" [attr.fill]="producto.variante" cx="100" cy="112" rx="86" ry="54" />
      <ellipse cx="100" cy="112" rx="72" ry="42" fill="none" stroke="#d4a73c" stroke-opacity=".6" stroke-dasharray="6 6" />
      <image href="assets/logo.png" x="74" y="84" width="52" height="52" />
    </g>

    <g *ngSwitchDefault>
      <ng-container *ngIf="producto.variante === 'mix'; else fichasBasicas">
        <image href="assets/chip-1.png" x="12" y="70" width="92" height="92" transform="rotate(-10 58 116)" />
        <image href="assets/chip-10.png" x="94" y="50" width="92" height="92" transform="rotate(12 140 96)" />
        <image href="assets/chip-100.png" x="42" y="84" width="106" height="106" />
      </ng-container>
      <ng-template #fichasBasicas>
        <image href="assets/chip-25.png" x="16" y="64" width="96" height="96" transform="rotate(-8 64 112)" />
        <image href="assets/chip-5.png" x="88" y="48" width="96" height="96" transform="rotate(10 136 96)" />
        <image href="assets/chip-100.png" x="42" y="82" width="106" height="106" />
      </ng-template>
    </g>

  </ng-container>
</svg>
