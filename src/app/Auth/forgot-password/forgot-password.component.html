<ion-content [fullscreen]="true">
<div class="fp-screen">
  <app-atmosphere [glow]="0.28" [count]="10"></app-atmosphere>

  <div class="fp-body">

    <!-- Header -->
    <button class="fp-back" (click)="goBack()">
      <app-icon [svg]="iconLock" [size]="16" style="color:rgba(203,185,143,0.55)"></app-icon>
      Volver al inicio de sesión
    </button>

    <!-- Ícono -->
    <div class="fp-icon-wrap">
      <div class="fp-icon">
        <app-icon [svg]="iconKeypad" [size]="36" style="color:var(--gold-1)"></app-icon>
      </div>
    </div>

    <div class="fp-title">Recuperar contraseña</div>
    <div class="fp-subtitle">
      Enviamos un código de 6 dígitos al correo:
    </div>

    <!-- Email destino -->
    <div class="fp-email-badge">
      <app-icon [svg]="iconMail" [size]="15" style="color:var(--gold-1)"></app-icon>
      <span>{{ email }}</span>
    </div>

    <!-- Formulario -->
    <form class="fp-form" [formGroup]="form" (ngSubmit)="submit()">

      <div class="fp-field-label">Código de verificación</div>
      <input
        class="fp-code-input"
        formControlName="code"
        inputmode="numeric"
        maxlength="6"
        placeholder="000000"
        autocomplete="one-time-code"
      />
      <div class="fp-code-hint" *ngIf="codeCtrl.touched && codeCtrl.invalid">
        El código debe tener exactamente 6 dígitos.
      </div>

      <app-field
        label="Nueva contraseña"
        placeholder="Mínimo 8 caracteres"
        [password]="true"
        [control]="newPasswordCtrl"
      ></app-field>

      <app-field
        label="Confirmar contraseña"
        placeholder="Repite la nueva contraseña"
        [password]="true"
        [control]="confirmPasswordCtrl"
      ></app-field>

      <div class="fp-error" *ngIf="errorMsg">{{ errorMsg }}</div>

      <button class="fp-submit" type="submit" [disabled]="loading">
        {{ loading ? 'Verificando…' : 'Restablecer contraseña' }}
      </button>
    </form>

    <!-- Reenviar código -->
    <div class="fp-resend">
      <span *ngIf="!codeResent">¿No recibiste el código?</span>
      <span *ngIf="codeResent" class="fp-resent-ok">¡Código reenviado!</span>
      <button
        class="fp-resend-btn"
        *ngIf="!codeResent"
        [disabled]="loadingCode"
        (click)="resendCode()"
      >
        {{ loadingCode ? 'Enviando…' : 'Reenviar' }}
      </button>
    </div>

  </div>
</div>
</ion-content>
