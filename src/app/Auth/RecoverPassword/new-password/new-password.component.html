<ion-content [fullscreen]="true" class="auth-content">
  <app-atmosphere [glow]="0.38" [count]="10"></app-atmosphere>

  <div class="auth-wrap">
    <app-auth-header
      title="Nueva contraseña"
      subtitle="Crea una clave segura"
      [logoSize]="80"
      (backClick)="goBack()"
    ></app-auth-header>

    <p class="intro">
      Crea una nueva contraseña segura para tu cuenta.
    </p>

    <!-- Nueva contraseña -->
    <div>
      <div class="field-label">Nueva contraseña</div>
      <div class="pass-wrap" [class.pass-wrap--focus]="focusPw">
        <input
          class="pass-input"
          [type]="showPw ? 'text' : 'password'"
          [(ngModel)]="pw"
          (focus)="focusPw = true"
          (blur)="focusPw = false"
          placeholder="••••••••••"
        />
        <button class="eye-btn" (click)="showPw = !showPw">
          <app-icon [svg]="showPw ? iconEyeOff : iconEye" [size]="20"></app-icon>
        </button>
      </div>
    </div>

    <!-- Requirements checklist -->
    <div class="reqs-list">
      <div
        *ngFor="let r of reqs; let i = index"
        class="req-row"
      >
        <div
          class="req-circle"
          [class.req-circle--ok]="results()[i]"
        >
          <app-icon
            [svg]="iconCheck"
            [size]="12"
            class="req-check"
            [class.req-check--ok]="results()[i]"
          ></app-icon>
        </div>
        <span class="req-label" [class.req-label--ok]="results()[i]">
          {{ r.label }}
        </span>
      </div>
    </div>

    <!-- Confirmar -->
    <div>
      <div class="field-label">Confirmar nueva contraseña</div>
      <div class="pass-wrap" [class.pass-wrap--focus]="focusConfirm">
        <input
          class="pass-input"
          [type]="showConfirm ? 'text' : 'password'"
          [(ngModel)]="confirm"
          (focus)="focusConfirm = true"
          (blur)="focusConfirm = false"
          placeholder="••••••••••"
        />
        <button class="eye-btn" (click)="showConfirm = !showConfirm">
          <app-icon [svg]="showConfirm ? iconEyeOff : iconEye" [size]="20"></app-icon>
        </button>
      </div>
    </div>

    <div *ngIf="confirm.length > 0 && !match" class="mismatch-row">
      <app-icon [svg]="iconClose" [size]="15" style="color:#e06a6a"></app-icon>
      <span>Las contraseñas no coinciden</span>
    </div>

    <app-gold-button
      [style.opacity]="ready ? 1 : 0.6"
      (clicked)="submit()"
    >Actualizar contraseña</app-gold-button>

    <div class="back-link-row">
      <span class="back-link" (click)="goLogin()">Volver al inicio de sesión</span>
    </div>
  </div>
</ion-content>
