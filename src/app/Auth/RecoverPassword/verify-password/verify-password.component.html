<ion-content [fullscreen]="true" class="auth-content">
  <app-atmosphere [glow]="0.4" [count]="11"></app-atmosphere>

  <div class="auth-wrap">
    <app-auth-header
      title="Verificar código"
      subtitle="Confirma que eres tú"
      [logoSize]="86"
      (backClick)="goBack()"
    ></app-auth-header>

    <p class="intro">
      Hemos enviado un código de 6 dígitos a tu correo electrónico.
    </p>

    <!-- Email card -->
    <div class="email-card">
      <div class="email-icon">
        <app-icon [svg]="iconMail" [size]="19" style="color:var(--gold-1)"></app-icon>
      </div>
      <div>
        <span class="email-label">Código enviado a:</span>
        <div class="email-value">juanperez&#64;email.com</div>
        <span class="email-hint">Revisa tu bandeja de entrada y también tu carpeta de spam.</span>
      </div>
    </div>

    <!-- OTP inputs -->
    <div>
      <div class="otp-label">Código de verificación</div>
      <div class="otp-row" [class.otp-row--shake]="shake">
        <input
          *ngFor="let d of digits; let i = index"
          #otpInput
          class="otp-input"
          [class.otp-input--filled]="!!d"
          [value]="d"
          (input)="setAt(i, $any($event.target).value)"
          (keydown)="onKey(i, $event)"
          inputmode="numeric"
          maxlength="6"
        />
      </div>
    </div>

    <!-- Resend -->
    <div class="resend-row">
      ¿No recibiste el código?
      <span *ngIf="timer > 0" class="resend-disabled">Reenviar ({{ fmt(timer) }})</span>
      <span *ngIf="timer === 0" class="resend-active" (click)="resend()">Reenviar</span>
    </div>

    <app-gold-button
      [style.opacity]="complete ? 1 : 0.6"
      (clicked)="submit()"
    >Verificar código</app-gold-button>

    <div class="back-link-row">
      <span class="back-link" (click)="goLogin()">Volver al inicio de sesión</span>
    </div>
  </div>
</ion-content>
