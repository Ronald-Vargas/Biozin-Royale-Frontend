<ion-content [fullscreen]="true" class="auth-content">
  <app-atmosphere [glow]="0.4" [count]="10"></app-atmosphere>

  <div class="auth-wrap">
    <app-auth-header
      title="Recuperar contraseña"
      subtitle="Restablece tu acceso"
      [logoSize]="92"
      (backClick)="goBack()"
    ></app-auth-header>

    <p class="forgot-desc">
      Ingresa tu correo electrónico y te enviaremos un código
      para restablecer tu contraseña.
    </p>

    <app-field
      label="Correo electrónico"
      type="email"
      placeholder="ejemplo@correo.com"
      [control]="emailCtrl"
    ></app-field>

    <app-gold-button (clicked)="submit()">Enviar código</app-gold-button>

    <div class="footer-line">
      ¿Recordaste tu contraseña?
      <span class="link-gold-bold" (click)="goLogin()">Iniciar sesión</span>
    </div>

    <!-- Security banner -->
    <div class="security-banner">
      <app-icon [svg]="iconShield" [size]="22" class="shield-icon"></app-icon>
      <div>
        <div class="security-title">Tu seguridad es importante</div>
        <div class="security-body">
          Te enviaremos un código temporal para verificar que eres tú.
        </div>
      </div>
    </div>
  </div>
</ion-content>
